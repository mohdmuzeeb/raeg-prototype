# M7 SHORT RE-CALIBRATION (user instruction 2026-10-11) after protocol changes PC-1..PC-4:
# 5 cells × 4 representative systems × seed 102 = 20 runs, with the revised pilot's settings.
# Purpose: observed wall clock for the revised pilot projection. Never reported as results.
name: pilot-recalibration
purpose: "M7 short re-calibration after PC-1..PC-4: observed per-run wall clock for the revised pilot projection"
excluded_from_paper: true
seeds: [102]   # disjoint from pilot (1-3) and first calibration (101) seeds
workload:
  n_actions: 200
  arrival_rate_per_s: 10
  duplicate_fraction: 0.05
  duplicate_copies: 2
driver:
  agent_timeout_s: 30
  restart_backoff_ms: 1000   # agent retry: 1 s, doubling, capped at 8 s, until the agent horizon (PC-2)
  max_backoff_ms: 8000
  max_resubmits: 50          # safety cap only
  poll_ms: 250
  horizon_s: 60              # agent horizon, same for every system
  drain_s: 5
cells:
  - {profile: P1, fault: F0, fault_rate: 0.0, assumption_set: S}
  - {profile: P4, fault: FM, fault_rate: 0.2, assumption_set: S}
  - {profile: P6, fault: FM, fault_rate: 0.2, assumption_set: S}
  - {profile: P4, fault: FC-worker, fault_rate: 0.0, assumption_set: S, arrival_rate_per_s: 3}
  - {profile: P4, fault: FC-api, fault_rate: 0.0, assumption_set: S, arrival_rate_per_s: 3}
systems: [B1, B3, B3L-horizon, RAEG-strict]   # one representative per system family
