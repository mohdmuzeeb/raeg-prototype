# M7 BRING-UP TIMING BATCH (user instruction 2026-10-11, Option A): after the start-up optimisation (N56),
# 2 cells × 2 systems × seed 103 = 4 runs. Same workload/driver settings as the revised pilot.
# Purpose: observed bring-up time (Temporal and non-Temporal stacks) for the 280-run projection, and a
# worker crash/restart check under the new compose settings. Never reported as results.
name: pilot-timing
purpose: "M7 Option A: measure bring-up after the start-up optimisation (N56) for the revised pilot projection"
excluded_from_paper: true
seeds: [103]   # disjoint from pilot (1-3), calibration (101) and recalibration (102) seeds
workload:
  n_actions: 200
  arrival_rate_per_s: 10
  duplicate_fraction: 0.05
  duplicate_copies: 2
driver:
  agent_timeout_s: 30
  restart_backoff_ms: 1000
  max_backoff_ms: 8000
  max_resubmits: 50
  poll_ms: 250
  horizon_s: 60
  drain_s: 5
cells:
  - {profile: P4, fault: FM, fault_rate: 0.2, assumption_set: S}
  - {profile: P4, fault: FC-worker, fault_rate: 0.0, assumption_set: S, arrival_rate_per_s: 3}
systems: [B3, RAEG-strict]   # one Temporal stack, one RAEG stack
