# M6 harness exercise of crash/zombie hooks through the full pipeline (FM mixture incl. CP1/CP2/CP3).
# NOT a pilot and NOT a result: excluded from every paper table and figure.
name: m6-faults
purpose: "M6 harness exercise of hook-based faults (pipeline completeness only; not a measurement)"
excluded_from_paper: true
seeds: [1]
workload:
  n_actions: 20
  arrival_rate_per_s: 5
driver:
  agent_timeout_s: 30
  restart_backoff_ms: 1000
  max_resubmits: 5
  poll_ms: 250
  horizon_s: 60
  drain_s: 8
cells:
  - {profile: P4, fault: FM, fault_rate: 0.4, assumption_set: S}
systems: [RAEG-strict, B1, B3]
