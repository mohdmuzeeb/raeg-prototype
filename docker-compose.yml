# Core stack (DESIGN §9). Per-system overlays are added in compose/ from M3 onward.
name: raeg

x-postgres: &postgres
  image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  # fsync stays ON: durability is assumption S3 (DESIGN §11.1).
  command: ["postgres", "-c", "max_connections=200"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  provider-db:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: provider
    ports: ["127.0.0.1:55433:5432"]
    volumes: [provider-db:/var/lib/postgresql/data]

  raeg-db:
    <<: *postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raeg
    ports: ["127.0.0.1:55432:5432"]
    volumes: [raeg-db:/var/lib/postgresql/data]

  provider:
    build: {context: ., dockerfile: docker/python.Dockerfile}
    image: raeg/python:dev
    command: ["python", "-m", "payment_provider.app"]
    depends_on:
      provider-db: {condition: service_healthy}
    environment:
      PROVIDER_DB_DSN: postgresql://postgres:postgres@provider-db:5432/provider
      PROVIDER_PROFILE: /app/config/profiles/${PROVIDER_PROFILE_ID:-P1}.yaml
      ORACLE_TOKEN: ${ORACLE_TOKEN:-local-oracle-token}
      PROVIDER_ALLOW_RESET: ${PROVIDER_ALLOW_RESET:-0}
      PROVIDER_PORT: "8001"
      ORACLE_PORT: "9001"
    ports:
      - "127.0.0.1:18001:8001"   # public API
      - "127.0.0.1:19001:9001"   # oracle/admin (harness only)
    restart: unless-stopped
    stop_grace_period: 3s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- M5: systems under test
  # Started with `make up-systems` (profiles "systems" + "temporal"). The harness starts "temporal"
  # only for B3/B3L runs.
  temporal-db:
    <<: *postgres
    profiles: [temporal]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes: [temporal-db:/var/lib/postgresql/data]

  temporal:
    image: temporalio/auto-setup:1.28.1@sha256:607d68caa111338d754771efb876c92dfcdae06d056e4530bb31cd0f37406e6a
    profiles: [temporal]
    depends_on:
      temporal-db: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports: ["127.0.0.1:17233:7233"]
    restart: unless-stopped

  temporal-worker:
    image: raeg/python:dev
    profiles: [temporal]
    command: ["python", "-m", "systems.temporal_wf.worker"]
    depends_on: [temporal, provider]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      PROVIDER_URL: http://provider:8001
      EXCHANGE_LOG_DIR: /exchange-logs
      HOOK_PLAN: /exchange-logs/hooks.json   # re-read on change; absent = no hooks
    volumes: [exchange-logs:/exchange-logs]
    restart: unless-stopped   # a crash hook (os._exit) kills the worker; Temporal retries the activity

  systems:
    image: raeg/python:dev
    profiles: [systems]
    command: ["python", "-m", "systems.serve"]
    depends_on:
      provider: {condition: service_healthy}
      raeg-db: {condition: service_healthy}
      temporal: {condition: service_started, required: false}  # only with --profile temporal
    environment:
      PROVIDER_URL: http://provider:8001
      RAEG_DB_APP_DSN: postgresql://raeg_app:raeg_app@raeg-db:5432/raeg
      RAEG_DB_ADMIN_DSN: postgresql://postgres:postgres@raeg-db:5432/raeg
      TEMPORAL_ADDRESS: temporal:7233
      EXCHANGE_LOG_DIR: /exchange-logs
      HOOK_PLAN: /exchange-logs/hooks.json   # re-read on change; absent = no hooks
      CODE_SHA: ${CODE_SHA:-unknown}
      SYSTEMS: ${SYSTEMS:-}
      CRASH_TOKEN: ${CRASH_TOKEN:-local-crash-token}   # FC-api (harness only)
      PORT: "8080"
    ports: ["127.0.0.1:18080:8080"]
    volumes: [exchange-logs:/exchange-logs]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  raeg-worker:   # RAEG recovery worker (DESIGN §5.1); crash hooks fire here (FC-worker)
    image: raeg/python:dev
    profiles: [systems]
    command: ["python", "-m", "systems.raeg_worker"]
    depends_on:
      provider: {condition: service_healthy}
      raeg-db: {condition: service_healthy}
    environment:
      PROVIDER_URL: http://provider:8001
      RAEG_DB_APP_DSN: postgresql://raeg_app:raeg_app@raeg-db:5432/raeg
      RAEG_DB_ADMIN_DSN: postgresql://postgres:postgres@raeg-db:5432/raeg
      EXCHANGE_LOG_DIR: /exchange-logs
      HOOK_PLAN: /exchange-logs/hooks.json
      CODE_SHA: ${CODE_SHA:-unknown}
      SYSTEMS: ${SYSTEMS:-}
    volumes: [exchange-logs:/exchange-logs]
    restart: unless-stopped

volumes:
  provider-db:
  raeg-db:
  temporal-db:
  exchange-logs:
